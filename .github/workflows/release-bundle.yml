name: Test and build Windows release
on:
  pull_request:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --locked
      - run: uv run pytest -q
      - run: uv run python -m elmetron.cli.app validate-config
  windows:
    needs: python
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: uv sync --extra dev --locked
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: npm run lint
        working-directory: ui
      - run: npm test -- --run
        working-directory: ui
      - run: uv run python scripts/collect_licenses.py
      - run: uv run pyinstaller --noconfirm packaging/elmetron.spec
      - run: uv run python scripts/test_mcp.py --exe dist/Elmetron/elmetron-cli.exe --data-dir validation/mcp-ci
      - name: Install pinned Inno compiler
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile "$env:RUNNER_TEMP/inno.exe"
          if ((Get-AuthenticodeSignature "$env:RUNNER_TEMP/inno.exe").Status -ne 'Valid') { throw 'Invalid compiler signature' }
          Start-Process "$env:RUNNER_TEMP/inno.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -WindowStyle Hidden
      - shell: pwsh
        run: '& "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" packaging/elmetron.iss'
      - name: Verify installed runtime and data preservation
        shell: pwsh
        run: |
          ./scripts/test_installer.ps1 -Installer (Get-ChildItem dist/installers/*.exe).FullName -InstallDir "$env:RUNNER_TEMP/elmetron-install-test" -DataDir "$env:RUNNER_TEMP/elmetron-data-test"
      - name: Prepare matching source and checksums
        run: uv run python scripts/release_artifacts.py
      - uses: actions/upload-artifact@v4
        with:
          name: elmetron-windows-x64
          path: dist/installers/*
          if-no-files-found: error
      - name: Publish tagged beta
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/installers/* --verify-tag --prerelease --title "Elmetron $env:GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
