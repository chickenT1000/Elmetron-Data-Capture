# USER CONFIG: supported CX-505 and isolated simulator. See docs/CONFIGURATION.md.
# No remote calibration commands are shipped.

[profiles.cx505]
description = "Default CX-505 handshake and serial parameters"
transport = "ftdi"
poll_hex = "01 23 30 23 30 23 30 23 03"
poll_interval_s = 1.0
baud = 115200
data_bits = 8
stop_bits = 2.0
parity = "E"
latency_timer_ms = 2
read_timeout_ms = 500
write_timeout_ms = 500
chunk_size = 256

[profiles.cx505_sim]
description = "Simulation profile for bench harness"
transport = "sim"
poll_hex = "01 23 30 23 30 23 30 23 03"
poll_interval_s = 1.0
baud = 115200
data_bits = 8
stop_bits = 2.0
parity = "E"
latency_timer_ms = 2
read_timeout_ms = 500
write_timeout_ms = 500
chunk_size = 256
